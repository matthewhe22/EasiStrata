
                        <a class="nav-link dropdown-toggle" href="#" id="alertsDropdown" role="button"
                           data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                            <i class="fas fa-bell fa-fw"></i>
                            <!-- Counter - Alerts -->
                            <span class="badge badge-danger badge-counter">{{ notification_num }}</span>
                        </a>
                        <!-- Dropdown - Alerts -->
                        <div class="dropdown-list dropdown-menu dropdown-menu-right shadow animated--grow-in"
                             aria-labelledby="alertsDropdown">
                            <h6 class="dropdown-header">
                                Alerts Center
                            </h6>
                        {% if notification %}
                            {% for item in notification %}
                            <a class="dropdown-item d-flex align-items-center" href="#" id="{{ item.id }}">
                                <div class="mr-3">
                                    <div class="icon-circle bg-warning">
                                        <i class="fas fa-exclamation-triangle text-white"></i>
                                    </div>
                                </div>
                                <div>
                                    <div class="small text-gray-500">{{ item.createtime }}</div>
                                    <span class="font-weight-bold">{{ item.msg_subject }}</span>
                                </div>
                            </a>
                            {% endfor %}
                        {% endif %}

                            <a class="dropdown-item text-center small text-gray-500" href="{% url 'base:alert_list' %}">Show All Alerts</a>
                        </div>

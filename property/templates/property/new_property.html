<!DOCTYPE html>
{% extends "base/base.html" %}
{% load crispy_forms_tags %}
{% load static %}


{% block title_block %}
    New Property
{% endblock title_block %}


{% block body_content %}

    <form method="POST">
        {% csrf_token %}

        {{ form|crispy }}


        <input name="savebutton" class="btn btn-primary" type="submit" value="Save">
        <a name="cancel" class="btn btn-primary" href="{% url 'property:property_list' %}" role="button">Cancel</a>
    </form>

    {% block javascript %}
        <script src="{% static 'js/update_name.js' %}"></script>
    {% endblock javascript %}

{% endblock body_content %}
